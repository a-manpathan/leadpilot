services:
  - type: web
    name: leadpilot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DATABASE_URL
        sync: false
      - key: MAX_CRAWL_PAGES_PER_SITE
        value: "3"
      - key: HTTP_TIMEOUT_SECONDS
        value: "8"
      - key: REQUEST_DELAY_SECONDS
        value: "1.0"
